version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: 2go-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: 2go_prod
    networks:
      - 2go-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: 2go-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/2go_prod
      JWT_ACCESS_SECRET: 2go_prod_jwt_access_secret_key_32chars_min
      JWT_REFRESH_SECRET: 2go_prod_jwt_refresh_secret_key_32chars_min
      CORS_ORIGIN: "*"
    depends_on:
      - mongodb
    networks:
      - 2go-network

  nginx:
    image: nginx:alpine
    container_name: 2go-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - 2go-network

volumes:
  mongo-data:

networks:
  2go-network:
    driver: bridge
